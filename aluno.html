<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estamos em Manutenção</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #ff9800;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .bar {
            width: 100%;
            background-color: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress {
            width: 70%; /* Podes alterar a percentagem de progresso aqui */
            background-color: #2ecc71;
            height: 100%;
            border-radius: 4px;
            animation: pulse 2s infinite ease-in-out;
        }

        .footer {
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚙️</div>
        
        <h1>Voltamos já!</h1>
        
        <p>O nosso site está a passar por uma manutenção programada para melhorar a tua experiência. Agradecemos a paciência e prometemos ser rápidos.</p>
        
        <div class="bar">
            <div class="progress"></div>
        </div>
        
        <div class="footer">
            &copy; 2026 O Teu Site. Todos os direitos reservados.
        </div>
    </div>

</body>
</html>
